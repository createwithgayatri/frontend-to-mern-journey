<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pricing — Simple plans that scale</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../src/style.css">

</head>
<body>

<section class="container py-5 py-md-5 my-md-4">
  <div class="text-center mb-5">
    <span class="eyebrow mb-3">Pricing</span>
    <h1 class="hero mt-3">Simple pricing that scales with you.</h1>
    <p class="lede mt-3">Pick the plan that fits today. Switch, upgrade, or cancel any time — no questions asked.</p>

    <div class="billing-toggle mt-4" role="tablist" aria-label="Billing period">
      <button id="btn-monthly" type="button">Monthly</button>
      <button id="btn-yearly" type="button" class="active">Yearly<span class="badge-pill">-25%</span></button>
    </div>
  </div>

  <div class="row g-4 align-items-stretch" id="plans"></div>
</section>

<script src="../src/script.js"></script>

</body>
</html>
