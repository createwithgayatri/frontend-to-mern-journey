<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 6 — Dashboard Sidebar UI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="d-flex" id="wrapper">
        <nav id="sidebar" class="bg-dark text-white">
            <div class="sidebar-header p-3 d-flex align-items-center justify-content-between">
                <span class="fs-5 fw-bold logo-text">DashBoard</span>
                <button id="sidebarCollapseClose" class="btn btn-dark d-md-none">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <ul class="list-unstyled components px-2">
                <li class="active">
                    <a href="#" class="nav-link text-white p-3 rounded d-flex align-items-center justify-content-between">
                        <div>
                            <i class="fas fa-tachometer-alt me-3"></i>
                            <span class="menu-text">Dashboard</span>
                        </div>
                    </a>
                </li>
                <li>
                    <a href="#" class="nav-link text-white p-3 rounded d-flex align-items-center justify-content-between">
                        <div>
                            <i class="fas fa-envelope me-3"></i>
                            <span class="menu-text">Messages</span>
                        </div>
                        <span class="badge bg-danger rounded-pill badge-text">5</span>
                    </a>
                </li>
                <li>
                    <a href="#" class="nav-link text-white p-3 rounded d-flex align-items-center justify-content-between">
                        <div>
                            <i class="fas fa-chart-bar me-3"></i>
                            <span class="menu-text">Analytics</span>
                        </div>
                    </a>
                </li>
                <li>
                    <a href="#" class="nav-link text-white p-3 rounded d-flex align-items-center justify-content-between">
                        <div>
                            <i class="fas fa-bell me-3"></i>
                            <span class="menu-text">Notifications</span>
                        </div>
                        <span class="badge bg-warning text-dark rounded-pill badge-text">New</span>
                    </a>
                </li>
                <li>
                    <a href="#" class="nav-link text-white p-3 rounded d-flex align-items-center justify-content-between">
                        <div>
                            <i class="fas fa-cog me-3"></i>
                            <span class="menu-text">Settings</span>
                        </div>
                    </a>
                </li>
            </ul>
        </nav>

        <div id="page-content-wrapper" class="w-100">
            <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom px-4 py-3">
                <button class="btn btn-outline-dark" id="sidebarCollapse">
                    <i class="fas fa-bars"></i>
                </button>
                <h5 class="ms-3 mb-0">Overview</h5>
            </nav>

            <div class="container-fluid p-4">
                <div class="row g-4 mb-4">
                    <div class="col-10 col-sm-6 col-xl-3">
                        <div class="card p-3 border-0 shadow-sm">
                            <span class="text-muted small">Total Revenue</span>
                            <h3 class="mb-0 mt-1">$24,500</h3>
                        </div>
                    </div>
                    <div class="col-10 col-sm-6 col-xl-3">
                        <div class="card p-3 border-0 shadow-sm">
                            <span class="text-muted small">Active Users</span>
                            <h3 class="mb-0 mt-1">1,240</h3>
                        </div>
                    </div>
                </div>

                <div class="row g-4">
                    <div class="col-12 col-lg-8">
                        <div class="card p-4 border-0 shadow-sm text-center justify-content-center placeholder-card">
                            <div class="text-muted py-5">
                                <i class="fas fa-chart-line fa-3x mb-3 text-secondary"></i>
                                <h5>Main Analytics Chart Placeholder</h5>
                                <p class="small text-muted">Chart.js or ApexCharts integration goes here</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-lg-4">
                        <div class="card p-4 border-0 shadow-sm text-center justify-content-center placeholder-card">
                            <div class="text-muted py-5">
                                <i class="fas fa-chart-pie fa-3x mb-3 text-secondary"></i>
                                <h5>Distribution</h5>
                                <p class="small text-muted">Pie/Donut chart placeholder</p>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
